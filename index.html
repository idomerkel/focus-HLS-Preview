<!DOCTYPE html>
<html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FOCUS — בדיקת יכולות AR</title>
<style>
:root{--navy:#0A1628;--panel:#17222D;--edge:#2B3B4C;--ink:#E8EEF4;--dim:#8DA0B3;
  --ok:#3FB984;--no:#E5484D;--amber:#E0A02E;--or:#EB872D}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--ink);padding:18px 16px 40px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Hebrew",Arial,sans-serif;
  font-size:16px;line-height:1.5}
h1{font-size:21px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
.row{display:flex;align-items:flex-start;gap:9px;background:var(--panel);border:1px solid var(--edge);
  border-radius:9px;padding:11px 12px;margin-bottom:7px}
.row .m{flex:0 0 auto;font-weight:700;width:22px;text-align:center}
.row .k{font-weight:600;font-size:14.5px}
.row .v{color:var(--dim);font-size:12.5px;word-break:break-word}
.y{color:var(--ok)}.n{color:var(--no)}.q{color:var(--amber)}
h2{font-size:13px;letter-spacing:1.6px;color:var(--or);margin:22px 0 8px;font-weight:700}
#verdict{background:var(--panel);border:1px solid var(--or);border-radius:11px;padding:14px;margin-bottom:20px;font-size:15px}
button{font:inherit;font-weight:600;background:var(--or);color:#1A0F04;border:none;border-radius:9px;
  padding:13px 16px;width:100%;margin-top:14px;cursor:pointer}
pre{background:#0D1620;border:1px solid var(--edge);border-radius:8px;padding:10px;
  font-size:11px;overflow-x:auto;color:var(--dim);direction:ltr;text-align:left}
</style></head><body>
<h1>בדיקת יכולות AR</h1>
<div class="sub">מה הטלפון הזה באמת יודע לעשות בדפדפן. אין מצלמה, אין הרשאות, רק שאילתה.</div>
<div id="verdict">בודק…</div>
<h2>מעקב חזותי במרחב</h2><div id="g1"></div>
<h2>חיישנים</h2><div id="g2"></div>
<h2>מכשיר</h2><div id="g3"></div>
<button id="copy">העתק את כל התוצאות</button>
<pre id="raw"></pre>
<script>
const R={};
function add(g,k,state,v){
  const d=document.createElement('div'); d.className='row';
  const m=state===true?'<span class="m y">✓</span>':state===false?'<span class="m n">✗</span>':'<span class="m q">?</span>';
  d.innerHTML=m+'<div><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
  document.getElementById(g).appendChild(d);
  R[k]=(state===true?'YES':state===false?'NO':'?')+' | '+v;
}
(async function(){
  // --- WebXR ---
  const hasXR = !!navigator.xr;
  add('g1','WebXR API קיים', hasXR, hasXR?'navigator.xr זמין':'navigator.xr לא קיים — אין WebXR בדפדפן הזה');
  let arOK=false, feats={};
  if(hasXR){
    try{ arOK = await navigator.xr.isSessionSupported('immersive-ar'); }catch(e){ arOK=false; }
    add('g1','מצב immersive-ar', arOK, arOK?'הטלפון יכול להריץ AR אמיתי בדפדפן':'לא נתמך — חסר ARCore או דפדפן לא תומך');
    if(arOK){
      for(const f of ['hit-test','dom-overlay','anchors','plane-detection','depth-sensing','light-estimation']){
        let ok=false;
        try{ const s=await navigator.xr.requestSession('immersive-ar',{optionalFeatures:[f]}); await s.end(); ok=true; }
        catch(e){ ok = (''+e).indexOf('user')>-1 ? null : false; }
        feats[f]=ok;
      }
    }
  } else {
    add('g1','מצב immersive-ar', false, 'לא נבדק');
  }
  add('g1','hit-test (הנחה על משטח אמיתי)', arOK?null:false, arOK?'נבדק רק בתוך סשן — ראה בהדגמה':'דורש immersive-ar');
  // --- sensors ---
  const oriP = (typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission);
  add('g2','דורש אישור מפורש לחיישנים', !!oriP, oriP?'כן — iOS. צריך הקשה של המשתמש':'לא — אנדרואיד, פתוח');
  let abs=false, rel=false, aMax=0, n1=0, n2=0;
  function h1(e){ rel=true; n1++; }
  function h2(e){ abs=true; n2++; }
  window.addEventListener('deviceorientation',h1,true);
  window.addEventListener('deviceorientationabsolute',h2,true);
  function h3(e){ const a=e.accelerationIncludingGravity; if(!a)return;
    const m=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2); if(m>aMax)aMax=m; }
  window.addEventListener('devicemotion',h3,true);
  await new Promise(r=>setTimeout(r,1800));
  window.removeEventListener('deviceorientation',h1,true);
  window.removeEventListener('deviceorientationabsolute',h2,true);
  add('g2','deviceorientation', rel, rel?n1+' אירועים ב-1.8 שניות':'שקט — לא התקבל אישור, או אין חיישן');
  add('g2','deviceorientationabsolute', abs, abs?n2+' אירועים — זרם שני קיים!':'לא קיים — זרם אחד בלבד');
  add('g2','devicemotion', aMax>0, aMax>0?('שיא תאוצה '+aMax.toFixed(2)+' m/s²'):'שקט');
  // --- device ---
  add('g3','מערכת', null, navigator.platform+' · '+(navigator.userAgentData?navigator.userAgentData.platform:'—'));
  add('g3','דפדפן', null, navigator.userAgent);
  add('g3','מסך', null, screen.width+'×'+screen.height+' @'+devicePixelRatio+'x');
  add('g3','מצלמות', null, 'נבדק רק בהדגמה (דורש הרשאה)');

  let v;
  if(arOK){
    v='<b>הטלפון הזה תומך ב-AR אמיתי בדפדפן.</b><br>אפשר לבנות הדגמה עם מעקב חזותי מלא — '
     +'הסימון ננעל על נקודה בחדר ונשאר שם באמת, עם מרחק אמיתי במטרים. '
     +'תכונות שנמצאו: <span style="direction:ltr;display:inline-block">'
     +Object.keys(feats).filter(k=>feats[k]===true).join(', ')+'</span>';
  } else if(hasXR){
    v='<b>יש WebXR אבל לא AR.</b> כנראה חסר ARCore (Google Play Services for AR) או שהדפדפן לא תומך. '
     +'כדאי לנסות ב-Chrome ולוודא שהאפליקציה ARCore מותקנת ומעודכנת.';
  } else {
    v='<b>אין WebXR בדפדפן הזה.</b> אם זה אייפון — זה צפוי, אפל לא תומכת ב-AR בדפדפן. '
     +'הפתרון לאייפון הוא מעקב מול תמונת עוגן מודפסת, או ספריית SLAM חיצונית.';
  }
  document.getElementById('verdict').innerHTML=v;
  document.getElementById('raw').textContent =
    Object.entries(R).map(([k,x])=>k+': '+x).join('\n')
    + '\nXR_FEATURES: ' + JSON.stringify(feats);
  document.getElementById('copy').onclick=function(){
    const t=document.getElementById('raw').textContent;
    navigator.clipboard.writeText(t).then(()=>{this.textContent='הועתק — הדבק לי כאן';},
      ()=>{this.textContent='בחר ידנית מהטקסט למטה';});
  };
})();
</script></body></html>
